name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v17
      - name: Syntax
        run: find bin tests container -type f \( -name '*.sh' -o -path 'bin/dx*' \) -print0 | xargs -0 -n1 bash -n
      # ShellCheck is pinned rather than taken from the runner image. 0.11.0
      # aborts with "Non-exhaustive patterns in checkCmd" on `x="$(source f)"`,
      # which is exactly how the import-purity contract is written in both
      # tests/test_refactor_contracts.sh and tests/test_section9_host_scripts.sh
      # (each proves libraries are side-effect free the same way). Verified:
      # 0.10.0 clean on the whole tree, 0.11.0 crashes on exactly those two
      # files. Re-test before bumping, and again when nixos-26.05 (the guest's
      # own pin) becomes the CI pin -- that is the next scheduled point to
      # re-check whether 0.11.x still crashes on this construct.
      - name: ShellCheck
        run: |
          find bin tests container -type f \( -name '*.sh' -o -path 'bin/dx*' \) -print0 \
            | xargs -0 nix shell "nixpkgs/${NIXPKGS_PIN}#shellcheck" --command shellcheck --severity=warning
        env:
          NIXPKGS_PIN: nixos-25.05
      - name: Container-free contracts
        run: tests/run_all_tests.sh --skip-integration
      - name: Sourceable shell coverage
        run: tests/run-coverage-linux.sh
      - name: Nix evaluation
        run: nix flake check --no-build --no-write-lock-file --all-systems ./container/aarch64-darwin-apple-container-dx-nixos-26.05
      # Always upload: the report is most useful precisely when the gate failed.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shell-coverage
          path: tests/coverage/out
          if-no-files-found: ignore

  bash-3-2:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Bash 3.2 host contracts
        run: tests/run-bash32-tests.sh
